<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ReplayAxis · Sports cases</title>
<style>
:root{color-scheme:dark;font:16px/1.5 system-ui;background:#081219;color:#e1eef4}
body{margin:0 auto;max-width:1400px;padding:clamp(16px,4vw,48px)}
h1{margin:0 0 24px;font-size:clamp(32px,5vw,54px);letter-spacing:-.04em}
main{display:grid;gap:26px;grid-template-columns:minmax(225px,310px) 1fr}
nav{display:grid;align-content:start;gap:4px}
button{font:inherit;color:inherit;text-align:left;border:1px solid transparent;background:none;padding:8px 12px;border-radius:6px;cursor:pointer}
button:hover,button[aria-current=true]{background:#102a37;border-color:#255065}
button:focus-visible,a:focus-visible{outline:2px solid #65e1ff;outline-offset:2px}
article{border:1px solid #255065;border-radius:10px;padding:clamp(16px,3vw,28px)}
h2{margin:0;font-size:clamp(22px,3vw,34px);line-height:1.2}
a{color:#78e7ff}p{max-width:72ch}iframe{border:0;width:100%;height:740px;margin-top:12px}
[hidden]{display:none}
@media(max-width:720px){main{grid-template-columns:1fr}nav{max-height:260px;overflow:auto}}
</style>
<h1>ReplayAxis</h1>
<p>Watch footage for the 16 benchmark cases. The 3D reconstructions are pending.</p>
<main>
<nav aria-label="Sports examples" id="cases"></nav>
<article>
<h2 id="name"></h2>
<p id="status" aria-live="polite"></p>
<p><a id="source" hidden>Watch source footage</a></p>

</article>
</main>
<script>
const cases = [
  [

    "https://www.youtube.com/watch?v=X7bj_LUIY7Y"
  ],
  [
    "Michael Phelps · Freestyle tumble turn",
    "Beijing 2008 men’s 200 m freestyle final. Review the first turn at 50 m.",
    "https://www.youtube.com/watch?v=Era0VAIUATw"
  ],
  [
    "Michael Phelps · Butterfly finish",
    "Beijing 2008 men’s 100 m butterfly finish against Milorad Čavić.",
    "https://www.youtube.com/watch?v=4xUIyPrJIr0"
  ],
  [
    "Jasprit Bumrah · Yorker",
    "Visakhapatnam 2024, second Test. Follow the 27.5 delivery to Ollie Pope.",
    "https://www.wisden.com/series/england-in-india-2023-24/cricket-news/jasprit-bumrah-destroys-ollie-popes-stumps-with-lethal-reverse-swinging-yorker"
  ],
  [
    "Shoaib Akhtar · Bouncer",
    "Perth 1999, third Test. Target the bouncer that Ponting leaves in Akhtar’s opening over; exact video interval pending.",
    "https://www.youtube.com/watch?v=jdrItizhcRA"
  ],
  [
    "Virat Kohli · Cover drive",
    "Champions Trophy 2025, India vs Pakistan. Use the cover drive that took Kohli to 14,000 ODI runs.",
    "https://indianexpress.com/article/sports/cricket/champions-trophy-ind-vs-pak-virat-kohli-14000-cover-drive-9852298/"
  ],
  [
    "Rohit Sharma · Pull shot",
    "Mumbai vs Jammu & Kashmir, 2025 Ranji Trophy. Target Rohit’s pull for six off Umar Nazir Mir.",
    "https://sports.ndtv.com/cricket/rohit-sharma-hits-trademark-pull-shot-for-six-ranji-trophy-crowd-cant-keep-calm-watch-7547085"
  ],
  [
    "Sachin Tendulkar · Straight drive",
    "Use approximately 0:07–0:10 in the ICC compilation. The side-on replay shows the bowling approach, delivery and Tendulkar’s follow-through. Original capture timing and the match delivery ID are unverified.",
    "https://www.icc-cricket.com/videos/some-of-sachin-tendulkar-s-finest-straight-drives"
  ],
  [
    "MS Dhoni · Stumping",
    "Candidate broadcast clip: Dhoni stumps Sabbir Rahman against Bangladesh at the 2016 World T20.",
    "https://thecricketlounge.com/video-ms-dhonis-brilliant-stumping-to-dismiss-shabbir/"
  ],
  [
    "Lionel Messi · Ankara Messi goal",
    "Barcelona vs Getafe, Copa del Rey 2007. Track Messi, the defenders, goalkeeper and ball separately.",
    "https://www.fcbarcelona.com/en/videos/975522/60-best-goal-ever-gol-leo-messi-barca-getafe-5-2-copa-del-rei-20062007"
  ],
  [
    "Cristiano Ronaldo · Bicycle kick",
    "Real Madrid vs Juventus, 2018 Champions League. UEFA’s replay shows multiple angles.",
    "https://www.youtube.com/watch?v=Nt8198a0acA"
  ],
  [
    "Armand Duplantis · World-record pole vault",
    "Tokyo 2025 World Championships, 6.30 m clearance.",
    "https://www.youtube.com/watch?v=2YZiuRVeZC0"
  ],
  [
    "Usain Bolt · World-record sprint",
    "Berlin 2009 World Championships, men’s 100 m final in 9.58 seconds.",
    "https://www.nbcolympics.com/videos/2009-worlds-usain-bolt-lowers-own-100m-world-record-958"
  ],
  [
    "Neymar · Rainbow flick",
    "2015 Copa del Rey final vs Athletic Bilbao. Track Neymar, the defender and the ball.",
    "https://www.youtube.com/watch?v=L4LkMLYNQqA"
  ],
  [
    "Roger Federer · Tennis",
    "Wimbledon 2019 final against Novak Djokovic. Target the championship point, from the serve through the end of the rally.",
    "https://www.youtube.com/watch?v=_8LObHvC1VY"
  ],
  [
    "Jan Železný · World-record javelin throw",
    "Jena 1996, 98.48 m throw. Archival upload.",
    "https://www.youtube.com/watch?v=F7uKIJqIVjQ"
  ]
];
const list = document.getElementById("cases");
const source = document.getElementById("source");
function select(index) {
 const [name,status,url] = cases[index];
 document.getElementById("name").textContent = name;
 document.getElementById("status").textContent = status || "Footage selection and reconstruction pending.";
 source.hidden = !url;
 if (url) source.href = url;
 else source.removeAttribute("href");
 Array.from(list.children).forEach((button,i)=>button.setAttribute("aria-current", String(i===index)));
}
cases.forEach(([name],index)=>{
 const button = document.createElement("button");
 button.type = "button";
 button.textContent = (index+1)+". "+name;
 button.addEventListener("click",()=>select(index));
 list.append(button);
});
select(0);
</script>
</html>
