 el('time').textContent=f.time.toFixed(3)+' s';
 el('source').textContent=f.source_frames.join(' / ');
 el('count').textContent=Object.keys(projected).length+' / '+Object.keys(data.joints).length;
 el('err').textContent=f.error_px===null?'—':f.error_px.toFixed(2)+' px';
 scrub.value=i;
}
function show(index){i=Math.max(0,Math.min(frames.length-1,index));render()}
function stop(){clearInterval(timer);timer=null;el('play').textContent='Play'}
el('play').onclick=()=>{if(timer!==null){stop();return}if(i===frames.length-1)show(0);el('play').textContent='Pause';timer=setInterval(()=>{if(i===frames.length-1)stop();else show(i+1)},1000/data.rate)};
el('prev').onclick=()=>{stop();show(i-1)};el('next').onclick=()=>{stop();show(i+1)};
scrub.oninput=()=>{stop();show(Number(scrub.value))};
el('reset').onclick=()=>{yaw=-.44;pitch=.12;zoom=1;render()};
el('mark').onclick=()=>toggleMark(joint.value);
canvas.onpointerdown=e=>{
 if(!e.isPrimary||e.button!==0)return;
 stop();
 drag={id:e.pointerId,x:e.clientX,y:e.clientY,orbit:false};
 canvas.setPointerCapture(e.pointerId);
};
canvas.onpointermove=e=>{
 if(!drag||drag.id!==e.pointerId)return;
 const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
 if(!drag.orbit&&Math.hypot(dx,dy)<5)return;
 drag.orbit=true;
 yaw+=dx*.012;pitch+=dy*.012;drag.x=e.clientX;drag.y=e.clientY;render();
};
canvas.onpointerup=e=>{
 if(!drag||e.pointerId!==drag.id)return;
 const orbit=drag.orbit||Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>=5;
 drag=null;
 if(orbit)return;
 const rect=canvas.getBoundingClientRect();
 const x=e.clientX-rect.left-canvas.clientLeft,y=e.clientY-rect.top-canvas.clientTop;
 if(pickMode.value==='surface'&&el('render-mode').value!=='skeleton'){markSurfaceAt(x,y);return;}
 let nearest=null,distance=14;
 for(const [id,[px,py]] of Object.entries(projected)){
  const d=Math.hypot(px-x,py-y);
  if(d<distance){nearest=id;distance=d;}
 }
 if(nearest!==null)toggleMark(nearest);
};
canvas.onpointercancel=canvas.onlostpointercapture=()=>drag=null;
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.min(5,Math.max(.25,zoom*Math.exp(-e.deltaY*.001)));render()},{passive:false});
canvas.onkeydown=e=>{const key={ArrowLeft:[-.1,0],ArrowRight:[.1,0],ArrowUp:[0,-.1],ArrowDown:[0,.1]}[e.key];if(key){e.preventDefault();yaw+=key[0];pitch+=key[1];render()}};
new ResizeObserver(render).observe(canvas);render();
</script></html>
